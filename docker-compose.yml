services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spillio
      POSTGRES_PASSWORD: spillio
      POSTGRES_DB: spillio
    ports:
      - "5432:5432"
    volumes:
      - spillio-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spillio -d spillio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spillio-postgres:
