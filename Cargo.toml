[workspace]
members = [
    "services/api",
    "services/api/crates/retro-core",
    "services/api/crates/retro-db",
    "cli",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://example.invalid/spillio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "uuid", "json"] }
uuid = { version = "1", features = ["serde"] }
