name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 linux linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release -p spill --target ${{ matrix.target }}

      - name: Package
        run: |
          name="spill-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf "${name}.tar.gz" spill
          shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            spill-${{ matrix.target }}.tar.gz
            spill-${{ matrix.target }}.tar.gz.sha256
